[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-spec-tools"
dynamic = ["version"]
description = "Reference implementation of the OVOS formal specifications"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasai", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "linguatag>=0.1.2a1",
]

[project.optional-dependencies]
# `langcodes` gives the full CLDR language distance; without it, a coarse
# language, script and region comparison ranks the fallback.
langcodes = [
    "linguatag[langcodes]>=0.1.2a1",
]
test = [
    "pytest",
    "linguatag[langcodes]>=0.1.2a1",
]

[project.scripts]
ovos-spec-lint = "ovos_spec_tools.lint:main"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-spec-tools"

[tool.setuptools.dynamic]
version = { attr = "ovos_spec_tools.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_spec_tools*"]
